name: Generate proof.json

on:
  push:
    branches: [main]
    paths-ignore:
      - "proof.json"
      - "ai-proof.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-proof
  cancel-in-progress: true

jobs:
  generate-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for this commit to be live on Cloudflare
        shell: bash
        run: |
          EXPECTED=$(sha256sum signals.json | awk '{print $1}')
          echo "Expected signals.json SHA-256: $EXPECTED"
          for i in {1..60}; do
            if curl -fsS "https://3webobs.com/signals.json?proof_wait=$GITHUB_SHA" -o /tmp/live-signals.json; then
              LIVE=$(sha256sum /tmp/live-signals.json | awk '{print $1}')
              echo "Live SHA-256: $LIVE"
              if [ "$LIVE" = "$EXPECTED" ]; then
                echo "Current commit is live."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Cloudflare did not publish this signals.json version in time."
          exit 1

      - name: Generate proof.json from live public files
        run: node scripts/generate-proof.mjs

      - name: Copy canonical manifest to ai-proof.json
        run: cp proof.json ai-proof.json

      - name: Commit proof manifests if changed
        shell: bash
        run: |
          if git diff --quiet -- proof.json ai-proof.json; then
            echo "No proof changes."
            exit 0
          fi
          git config user.name "3webs-proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add proof.json ai-proof.json
          git commit -m "chore: regenerate integrity proof"
          git push
