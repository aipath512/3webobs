name: Generate proof.json

on:
  push:
    branches: [main]
    paths-ignore:
      - "proof.json"
      - "ai-proof.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-proof
  cancel-in-progress: true

jobs:
  generate-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── CE ASTEPTAM ─────────────────────────────────────────────────────
      # Bucla verifica exact fisierele din PATHS (scripts/generate-proof.mjs).
      # HTML-ul nu mai e in lista: Cloudflare injecteaza automat beacon-ul
      # Web Analytics in fiecare pagina, deci octetii serviti nu pot fi
      # identici cu cei din repo. Asteptam doar fisierele pe care nimic nu
      # le modifica la livrare, deci potrivirea vine de obicei din prima
      # incercare.
      #
      # ── CAUZA CURSEI, REPARATA ──────────────────────────────────────────
      # Versiunea veche astepta doar ca signals.json sa fie live. Daca un
      # commit schimba index.html dar NU signals.json, bucla de asteptare
      # trecea instant (signals.json era deja live si identic din deploy-ul
      # anterior) si manifestul se genera peste un index.html VECHI.
      # Exact asta a produs mismatch-ul gasit de auditul extern.
      #
      # Acum asteptam pana cand FIECARE fisier din manifest are, live, exact
      # acelasi hash ca in repo la acest commit. Abia atunci deploy-ul e
      # sigur complet propagat.
      - name: Wait until the live site matches this commit, file by file
        shell: bash
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          mapfile -t PATHS < <(node -e '
            const src = require("fs").readFileSync("scripts/generate-proof.mjs","utf8");
            const m = src.match(/const PATHS = \[([\s\S]*?)\]/);
            if (!m) process.exit(1);
            for (const line of m[1].split("\n")) {
              const q = line.match(/"([^"]+)"/);
              if (q) console.log(q[1]);
            }
          ')

          echo "Verific ${#PATHS[@]} fisiere."

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            MISMATCHED=0
            FIRST_BAD=""
            for p in "${PATHS[@]}"; do
              LOCAL_FILE=".${p}"
              [ -f "$LOCAL_FILE" ] || continue
              EXPECTED=$(sha256sum "$LOCAL_FILE" | awk '{print $1}')
              if curl -fsS "https://3webobs.com${p}?proof_wait=${GITHUB_SHA}" -o /tmp/live_asset 2>/dev/null; then
                LIVE=$(sha256sum /tmp/live_asset | awk '{print $1}')
                if [ "$LIVE" != "$EXPECTED" ]; then
                  MISMATCHED=$((MISMATCHED+1))
                  [ -z "$FIRST_BAD" ] && FIRST_BAD="$p"
                fi
              else
                MISMATCHED=$((MISMATCHED+1))
                [ -z "$FIRST_BAD" ] && FIRST_BAD="$p (nu raspunde)"
              fi
            done

            if [ "$MISMATCHED" -eq 0 ]; then
              echo "Deploy-ul acestui commit este complet live. Continui."
              exit 0
            fi
            echo "Incercarea $attempt/$MAX_ATTEMPTS: $MISMATCHED fisiere inca nepropagate (primul: $FIRST_BAD)."
            sleep $SLEEP_SECONDS
          done

          echo "Cloudflare nu a propagat complet acest commit in timpul alocat."
          exit 1

      - name: Generate proof.json from live public files
        run: node scripts/generate-proof.mjs

      - name: Copy canonical manifest to ai-proof.json
        run: cp proof.json ai-proof.json

      # Verificare finala: manifestul proaspat generat trebuie sa corespunda
      # fisierelor din repo. Daca nu, mai bine esuam decat sa publicam o
      # dovada falsa.
      - name: Verify the generated manifest against the repo
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const proof = JSON.parse(fs.readFileSync("proof.json","utf8"));
            let bad = 0;
            for (const e of proof.files) {
              const local = "." + e.path;
              if (!fs.existsSync(local)) continue;
              const h = crypto.createHash("sha256").update(fs.readFileSync(local)).digest("hex");
              if (h !== e.sha256) {
                console.error("MISMATCH " + e.path + ": manifest " + e.sha256.slice(0,12) + " vs repo " + h.slice(0,12));
                bad++;
              }
            }
            if (bad) { console.error(bad + " nepotriviri - nu public un manifest fals."); process.exit(1); }
            console.log("Manifest verificat: toate hash-urile corespund repo-ului.");
          '

      - name: Commit proof manifests if changed
        shell: bash
        run: |
          if git diff --quiet -- proof.json ai-proof.json; then
            echo "No proof changes."
            exit 0
          fi
          git config user.name "3webs-proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add proof.json ai-proof.json
          git commit -m "chore: regenerate integrity proof"
          git push
